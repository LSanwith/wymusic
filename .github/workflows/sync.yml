name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 4 * * *" # 每天 12:00（UTC+8）
  workflow_dispatch:
  # 工作流自己改动时也跑一次，方便验证
  push:
    paths:
      - ".github/workflows/sync.yml"

# 同一时间只跑一个，避免两次同步互相打架
concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 版本要和 ci-check.yml 保持一致（那边用 pnpm 9 校验 --frozen-lockfile），
      # 否则这里重新生成的锁文件格式对不上，CI 会报 OUTDATED_LOCKFILE。
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Sync upstream changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/NeteaseCloudMusicApiEnhanced/api-enhanced.git 2>/dev/null || true

          if ! git fetch --no-tags upstream main; then
            echo "::error::stage=fetch 拉取上游失败（网络或上游仓库地址变了）"
            exit 1
          fi

          # 已经很新就直接成功退出（旧版这里会 exit 1，天天报假警）
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "已经包含上游最新提交（$(git rev-parse --short upstream/main)），无需同步"
            exit 0
          fi

          echo "上游有新提交，开始合并：$(git rev-parse --short upstream/main)"
          if ! git merge --no-edit upstream/main; then
            unresolved="$(git diff --name-only --diff-filter=U || true)"
            echo "冲突文件：$unresolved"
            if [ "$unresolved" != "pnpm-lock.yaml" ]; then
              echo "::error::stage=merge 出现需要人工处理的冲突：$unresolved"
              git merge --abort || true
              exit 1
            fi

            # 锁文件机器生成，不人肉解决：先取上游那份，再按合并后的
            # package.json 重新生成（本仓库多一个 @vercel/blob）。
            echo "pnpm-lock.yaml 冲突，取上游版本后重新生成"
            git checkout --theirs pnpm-lock.yaml
            git add pnpm-lock.yaml
            if ! pnpm install --lockfile-only --ignore-scripts; then
              echo "::error::stage=lockfile 重新生成 pnpm-lock.yaml 失败"
              exit 1
            fi
            git add pnpm-lock.yaml
            if ! git commit --no-edit; then
              echo "::error::stage=commit 提交合并结果失败"
              exit 1
            fi
          fi

          if ! git push origin HEAD:main; then
            echo "::error::stage=push 推送失败（权限或分支保护）"
            exit 1
          fi
          echo "已同步到 $(git rev-parse --short HEAD)"
