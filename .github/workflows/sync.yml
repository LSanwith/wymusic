name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 4 * * *" # 每天 12:00（UTC+8）
  workflow_dispatch:
  # 工作流自己改动时也跑一次，方便验证
  push:
    paths:
      - ".github/workflows/sync.yml"

# 同一时间只跑一个，避免两次同步互相打架
concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 版本要和 ci-check.yml 一致（那边用 pnpm 9 校验 --frozen-lockfile）
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Sync upstream changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/NeteaseCloudMusicApiEnhanced/api-enhanced.git 2>/dev/null || true

          if ! git fetch --no-tags upstream main; then
            echo "::error::stage=fetch 拉取上游失败"
            exit 1
          fi

          # 已经很新就直接成功退出（旧版这里会 exit 1，天天报假警）
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "已经包含上游最新提交（$(git rev-parse --short upstream/main)），无需同步"
            exit 0
          fi

          echo "上游有新提交，开始合并：$(git rev-parse --short upstream/main)"
          git merge --no-commit --no-ff upstream/main || true

          # 1) 锁文件冲突：机器生成的不人肉解决，取上游那份后重新生成
          #    （本仓库多一个 @vercel/blob，纯取上游会被 CI 的 --frozen-lockfile 拒绝）
          if [ "$(git diff --name-only --diff-filter=U || true)" = "pnpm-lock.yaml" ]; then
            echo "pnpm-lock.yaml 冲突，取上游版本后重新生成"
            git checkout --theirs pnpm-lock.yaml
            git add pnpm-lock.yaml
            if ! pnpm install --lockfile-only --ignore-scripts; then
              echo "::error::stage=lockfile 重新生成 pnpm-lock.yaml 失败"
              git merge --abort || true
              exit 1
            fi
            git add pnpm-lock.yaml
          fi

          # 2) 还有别的冲突就交给人
          u="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$u" ]; then
            echo "::error::stage=merge 出现需要人工处理的冲突：$u"
            git merge --abort || true
            exit 1
          fi

          # 3) 工作流目录一律保留本仓库的版本。
          #    GITHUB_TOKEN 无权推送 .github/workflows/ 的改动（GitHub 的硬限制），
          #    不还原的话 git push 会被拒绝。
          git checkout HEAD -- .github/workflows/ 2>/dev/null || true
          git reset -q HEAD -- .github/workflows/ 2>/dev/null || true
          git clean -qfd .github/workflows/ 2>/dev/null || true
          git checkout HEAD -- .github/workflows/ 2>/dev/null || true
          git add -A .github/workflows/ 2>/dev/null || true

          if ! git diff --cached --quiet HEAD -- .github/workflows/; then
            echo "::error::stage=workflows 无法把 .github/workflows/ 还原成本仓库版本"
            git merge --abort || true
            exit 1
          fi

          if ! git commit --no-edit; then
            echo "::error::stage=commit 提交合并结果失败"
            exit 1
          fi

          if ! git push origin HEAD:main 2>&1; then
            echo "::error::stage=push 推送失败，git 原始输出见上"
            exit 1
          fi
          echo "已同步到 $(git rev-parse --short HEAD)"
