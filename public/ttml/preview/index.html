<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" href="/docs/netease.png">
    <title>TTML 歌词预览 · Sanwith</title>
    <link rel="stylesheet" href="/nav.css">
    <!-- AMLL 播放器的样式：两个 CDN 互为兜底，谁先到用谁 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@applemusic-like-lyrics/core@0.6.0/dist/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@applemusic-like-lyrics/core@0.6.0/dist/style.css">
    <style>
        :root {
            --fg: #ffffff;
            --muted: rgba(255, 255, 255, 0.7);
            --card-bg: rgba(255, 255, 255, 0.09);
            --card-border: rgba(255, 255, 255, 0.15);
            --btn-bg: rgba(255, 255, 255, 0.12);
            --ok: #7ee2a8;
            --err: #ff9c9c;
        }
        * { box-sizing: border-box; }
        html { scrollbar-width: none; -ms-overflow-style: none; }
        html::-webkit-scrollbar { display: none; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--fg);
            background: #0a0a0c;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image: url('/bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.7);
        }
        .container {
            max-width: 960px;
            margin: 32px auto 60px;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }
        header.site-header { margin-bottom: 22px; user-select: none; }
        header.site-header h1 {
            font-size: 28px;
            font-weight: 600;
            margin: 0;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }
        header.site-header .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

        .block {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 22px 24px;
            margin-bottom: 18px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
        }
        .block h2 {
            margin: 0 0 14px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        input[type="text"], input[type="file"], textarea {
            flex: 1 1 240px;
            min-width: 0;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            color: var(--fg);
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            outline: none;
        }
        textarea {
            width: 100%;
            min-height: 150px;
            flex: none;
            resize: vertical;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 12.5px;
            line-height: 1.5;
        }
        input[type="file"] { flex: 0 1 auto; padding: 8px 10px; }
        input:focus, textarea:focus { border-color: rgba(255, 255, 255, 0.45); }
        input::placeholder, textarea::placeholder { color: rgba(255, 255, 255, 0.35); }
        button {
            padding: 10px 18px;
            font-size: 14px;
            font-family: inherit;
            color: var(--fg);
            background: var(--btn-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.2); }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
        .hint.ok { color: var(--ok); }
        .hint.err { color: var(--err); }
        a { color: #9ecbff; }

        /* ---------- 播放器 ---------- */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 14px;
        }
        .controls button { min-width: 88px; }
        input[type="range"] {
            flex: 1 1 200px;
            min-width: 0;
            accent-color: #fff;
            cursor: pointer;
        }
        #clock {
            flex: 0 0 auto;
            font-family: ui-monospace, Consolas, monospace;
            font-size: 12.5px;
            color: var(--muted);
            min-width: 128px;
            text-align: right;
        }
        /* AMLL 播放器自己的容器。背景要够深，否则白色歌词压在亮背景图上会发灰 */
        #stage {
            position: relative;
            height: 460px;
            border-radius: 12px;
            overflow: hidden;
            background: #14161c;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        #stageMount { width: 100%; height: 100%; }
        /* AMLL 默认给播放器 mix-blend-mode: plus-lighter（要配合专辑封面背景）。
           本页背景是深色图，这个混合模式会让歌词几乎看不见，改成普通混合；
           注意 contain: strict 不能动 —— 它内部是按这个约束做绝对定位的。 */
        #stageMount .amll-lyric-player {
            mix-blend-mode: normal !important;
            --amll-lp-color: #fff;
        }
        #stageHint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            color: var(--muted);
            font-size: 14px;
            pointer-events: none;
        }
        #stageHint.gone { display: none; }
        .meta {
            margin-top: 12px;
            font-size: 13px;
            color: var(--muted);
            word-break: break-word;
        }
        .meta b { color: var(--fg); font-weight: 500; }
        .links { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 14px; font-size: 13px; }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-list">
            <a href="/">音乐界面</a>
            <a href="/file/">文件挂载代理</a>
            <a href="/ttml/" class="active">TTML 歌词</a>
        </div>
        <span class="nav-brand">
            <a href="https://github.com/neteasecloudmusicapienhanced/api-enhanced" target="_blank" rel="noopener">GitHub</a>
            <span class="footer-sep">|</span>
            <a href="https://qm.qq.com/eetuZkIV20" target="_blank" rel="noopener">添加管理员QQ</a>
        </span>
    </nav>

    <main class="container">
        <header class="site-header">
            <h1>TTML 歌词预览</h1>
            <p class="sub">AMLL 播放器渲染 · 逐字点亮 · 翻译/音译/背景人声/对唱均由规范自动处理</p>
        </header>

        <section class="block">
            <h2>加载歌词</h2>
            <div class="row">
                <input type="text" id="songId" inputmode="numeric" maxlength="20" placeholder="网易云歌曲 id，例如 186016">
                <button type="button" id="loadBtn">按 id 读取</button>
                <button type="button" id="demoBtn">示例</button>
                <button type="button" id="pasteToggle">粘贴 TTML</button>
            </div>
            <div id="songSearch"></div>
            <div id="pasteWrap" hidden style="margin-top:12px">
                <textarea id="ttmlText" placeholder="把 TTML 粘到这里，也可以选择文件"></textarea>
                <div class="row" style="margin-top:10px">
                    <input type="file" id="ttmlFile" accept=".ttml,.xml,text/xml,application/xml">
                    <button type="button" id="usePasted">使用这份 TTML</button>
                </div>
            </div>
            <div class="meta" id="meta"></div>
            <div class="hint" id="loadInfo">按 id 读取已通过审核的歌词，或直接粘贴 TTML。播放器由 AMLL 提供。</div>
        </section>

        <section class="block">
            <div class="controls">
                <button type="button" id="playBtn" disabled>▶ 播放</button>
                <button type="button" id="resetBtn" disabled>重播</button>
                <input type="range" id="seek" min="0" max="1000" value="0" step="1" disabled>
                <span id="clock">00:00.00 / 00:00.00</span>
            </div>
            <div id="stage">
                <div id="stageMount"></div>
                <div id="stageHint">还没有加载歌词</div>
            </div>
            <div class="links">
                <a href="/ttml/">上传 TTML →</a>
                <a href="/ttml/demo/">接口演示 →</a>
                <a href="https://amll.dev/reference/core" target="_blank" rel="noopener">AMLL 文档 ↗</a>
            </div>
        </section>
    </main>

    <script src="/ttml/song-search.js"></script>
    <script type="module">
        const $ = (id) => document.getElementById(id)
        const loadInfo = $('loadInfo')
        const metaBox = $('meta')
        const stageMount = $('stageMount')
        const stageHint = $('stageHint')
        const playBtn = $('playBtn')
        const resetBtn = $('resetBtn')
        const seek = $('seek')
        const clock = $('clock')

        const CORE_CDNS = [
            'https://esm.sh/@applemusic-like-lyrics/core',
            'https://esm.sh/@applemusic-like-lyrics/core?bundle=all',
        ]
        const TTML_CDNS = [
            'https://esm.sh/@applemusic-like-lyrics/ttml',
            'https://esm.sh/@applemusic-like-lyrics/ttml?bundle=all',
        ]

        let Player = null
        let parseTTML = null
        let player = null
        let duration = 0        // 秒
        let t = 0               // 当前播放时间（秒）
        let playing = false
        let raf = 0
        let lastTs = 0
        // 当前歌词自己的身份（内容哈希）。一份 TTML 可以绑多个歌曲 id，这个值不变
        let currentTtmlId = ''

        function say(text, kind) {
            loadInfo.textContent = text
            loadInfo.className = 'hint' + (kind ? ' ' + kind : '')
        }
        function fmt(sec) {
            if (!isFinite(sec) || sec < 0) sec = 0
            const m = Math.floor(sec / 60)
            const s = sec - m * 60
            return String(m).padStart(2, '0') + ':' + s.toFixed(2).padStart(5, '0')
        }
        function ms(sec) { return Math.round(sec * 1000) }

        async function importFirst(list) {
            let lastErr = null
            for (const url of list) {
                try { return await import(url) } catch (e) { lastErr = e }
            }
            throw lastErr || new Error('全部 CDN 失败')
        }

        /**
         * 把「从接口或网页里复制出来的」TTML 还原成真正的 XML。
         *
         * 最常见的坑：直接从接口返回的 JSON 里复制 ttml / ttmlLocalizations 字段值，
         * 拿到的是 JSON 转义后的字符串 —— 属性引号前带反斜杠、整份挤成一行：
         *     <tt xmlns=\"http://www.w3.org/ns/ttml\">
         * 这种喂给 XML 解析器会报 AttValue: " or ' expected。
         * 从网页代码块复制则可能带 HTML 实体（&lt;tt ...&gt;）。两种都在这里还原。
         */
        function normalizeTtmlInput(raw) {
            let s = String(raw == null ? '' : raw).trim()
            if (!s) return s

            // 整段是一个 JSON 字符串字面量
            if (s.length > 1 && s[0] === '"' && s[s.length - 1] === '"') {
                try {
                    const v = JSON.parse(s)
                    if (typeof v === 'string') s = v.trim()
                } catch {
                    /* 不是合法 JSON 字符串，继续手工还原 */
                }
            }

            // 残留的 JSON 转义
            if (/\\[nrt"\/\\]/.test(s)) {
                s = s
                    .replace(/\\r/g, '\r')
                    .replace(/\\n/g, '\n')
                    .replace(/\\t/g, '\t')
                    .replace(/\\"/g, '"')
                    .replace(/\\'/g, "'")
                    .replace(/\\\//g, '/')
                    .replace(/\\\\/g, '\\')
            }

            // HTML 实体（&amp; 放最后）
            if (/&(?:lt|gt|quot|amp|#34|#39);/.test(s)) {
                s = s
                    .replace(/&lt;/g, '<')
                    .replace(/&gt;/g, '>')
                    .replace(/&quot;/g, '"')
                    .replace(/&#34;/g, '"')
                    .replace(/&#39;/g, "'")
                    .replace(/&amp;/g, '&')
            }

            // 前面还挂着包装就直接截出来（比如粘的是 JSON 里的
            //   "ttmlLocalizations": "<tt ...></tt>"  这一整行）
            const start = s.search(/<tt[\s>]/i)
            if (start > 0) {
                const end = s.lastIndexOf('</tt>')
                if (end > start) s = s.slice(start, end + 5).trim()
            }

            return s
        }

        /**
         * AMLL 的解析器要求每个 <p> 都带 itunes:key（否则整份解析出 0 行），
         * 并且用了 itunes: 前缀就必须声明对应的命名空间。
         * 这里给缺失的补上，让普通 TTML 也能直接喂给 AMLL。
         */
        function prepForAmll(ttml) {
            let s = String(ttml || '')
            if (!/xmlns:itunes\s*=/.test(s)) {
                s = s.replace(
                    /<tt\b([^>]*)>/,
                    (m, a) => `<tt${a} xmlns:itunes="http://music.apple.com/lyric-ttml-internal">`,
                )
            }
            // 已有的 key 先占位，免得补的时候撞号 —— 侧幕翻译就是靠 key 对应的
            const used = new Set(
                [...s.matchAll(/itunes:key\s*=\s*["']([^"']+)["']/g)].map((m) => m[1]),
            )
            let n = 0
            return s.replace(/<p\b([^>]*)>/g, (m, a) => {
                if (/itunes:key\s*=/.test(a)) return m
                let key
                do {
                    n++
                    key = 'L' + n
                } while (used.has(key))
                used.add(key)
                return `<p${a} itunes:key="${key}">`
            })
        }

        /** 从 AMLL 的 metadata（Map 或普通对象）里取一行摘要 */
        function metaText(metadata) {
            if (!metadata) return ''
            const pick = (k) => {
                let v
                if (typeof metadata.get === 'function') v = metadata.get(k)
                else v = metadata[k]
                if (Array.isArray(v)) v = v[0]
                return v ? String(v) : ''
            }
            const parts = []
            const name = pick('musicName')
            const artists = pick('artists')
            const album = pick('album')
            const lang = pick('language')
            const timing = pick('timingMode')
            if (name) parts.push('<b>' + name + '</b>')
            if (artists) parts.push(artists)
            if (album) parts.push('《' + album + '》')
            if (lang) parts.push('语言 ' + lang)
            if (timing) parts.push(timing === 'Word' ? '逐字' : '逐行')
            return parts.join(' · ')
        }

        function setControls(enabled) {
            playBtn.disabled = !enabled
            resetBtn.disabled = !enabled
            seek.disabled = !enabled
        }

        function updateClock() {
            clock.textContent = fmt(t) + ' / ' + fmt(duration)
            seek.value = duration > 0 ? String(Math.round((t / duration) * 1000)) : '0'
        }

        /** 把一份 TTML 渲染进 AMLL 播放器 */
        function render(rawTtml) {
            // 先还原 JSON 转义 / HTML 实体，再补 itunes:key，最后交给 AMLL
            const ttml = normalizeTtmlInput(rawTtml)
            const parsed = parseTTML(prepForAmll(ttml))
            const lines = parsed.lines || []
            if (!lines.length) {
                say('解析出 0 行。AMLL 需要每行带 itunes:key，我已经自动补了；还是 0 行说明这份 TTML 的结构 AMLL 不认。', 'err')
                stageHint.textContent = '这份 TTML 解析不出歌词行'
                stageHint.classList.remove('gone')
                setControls(false)
                return 0
            }

            pause()
            if (!player) {
                player = new Player()
                const el = player.getElement()
                el.style.width = '100%'
                el.style.height = '100%'
                stageMount.innerHTML = ''
                stageMount.appendChild(el)
                if (typeof player.onResize === 'function') player.onResize()
            }
            player.setLyricLines(lines, 0)
            // 容器尺寸变了要重新量一次，否则歌词会按旧高度定位、跑到可视区外
            if (typeof player.onResize === 'function') player.onResize()

            duration = (lines[lines.length - 1].endTime || 0) / 1000
            t = 0
            stageHint.classList.add('gone')
            setControls(true)
            updateClock()
            player.setCurrentTime(0)
            player.update(16)

            metaBox.innerHTML = [metaText(parsed.metadata), currentTtmlId ? '<b>ttmlId</b> ' + currentTtmlId : '']
                .filter(Boolean)
                .join(' · ')
            say('已加载 ' + lines.length + ' 行，总长 ' + fmt(duration).slice(3) + '，点播放开始预览。', 'ok')
            return lines.length
        }

        /* ---------- 播放循环：我们自己算时间，推进给 AMLL ---------- */
        function tick(ts) {
            if (!playing) return
            if (!lastTs) lastTs = ts
            const dt = (ts - lastTs) / 1000
            lastTs = ts
            t += dt
            if (t >= duration) {
                t = duration
                pushTime()
                pause()
                return
            }
            pushTime()
            updateClock()
            raf = requestAnimationFrame(tick)
        }
        function pushTime() {
            if (!player) return
            player.setCurrentTime(ms(t))
            if (typeof player.update === 'function') player.update(16)
        }
        function play() {
            if (!player || duration <= 0) return
            if (t >= duration) t = 0
            playing = true
            lastTs = 0
            playBtn.textContent = '⏸ 暂停'
            if (typeof player.resume === 'function') player.resume()
            raf = requestAnimationFrame(tick)
        }
        function pause() {
            playing = false
            if (raf) cancelAnimationFrame(raf)
            raf = 0
            playBtn.textContent = '▶ 播放'
            if (player && typeof player.pause === 'function') player.pause()
        }
        function seekTo(sec) {
            t = Math.max(0, Math.min(sec, duration || 0))
            pushTime()
            updateClock()
        }

        playBtn.addEventListener('click', () => { playing ? pause() : play() })
        resetBtn.addEventListener('click', () => { pause(); seekTo(0); play() })
        seek.addEventListener('input', () => {
            pause()
            seekTo((Number(seek.value) / 1000) * duration)
        })

        /* ---------- 数据来源 ---------- */
        $('songId').addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '').slice(0, 20)
        })
        $('loadBtn').addEventListener('click', async function () {
            const id = $('songId').value.replace(/\D/g, '')
            $('songId').value = id
            if (!id) return say('先填一个歌曲 id。', 'err')
            this.disabled = true
            say('读取中…')
            try {
                const r = await fetch('/search?ttml=' + id + '&_=' + Date.now())
                const j = await r.json()
                if (j.code !== 200 || !j.ttml) {
                    say((j.msg || '读取失败') + '（HTTP ' + j.code + '）', 'err')
                    return
                }
                currentTtmlId = j.ttmlId || ''
                render(j.ttml)
            } catch (e) {
                say('请求失败：' + (e && e.message ? e.message : e), 'err')
            } finally {
                this.disabled = false
            }
        })

        $('pasteToggle').addEventListener('click', () => {
            const w = $('pasteWrap')
            w.hidden = !w.hidden
            if (!w.hidden) $('ttmlText').focus()
        })

        /* 内置示例：带逐字时间、翻译、音译、背景人声，方便直接看效果 */
        const DEMO_TTML = `<tt xmlns="http://www.w3.org/ns/ttml" xmlns:ttm="http://www.w3.org/ns/ttml#metadata" xml:lang="zh" itunes:timing="Word">
<body><div>
<p begin="00:01.000" end="00:05.000"><span begin="00:01.000" end="00:03.000">故事</span><span begin="00:03.000" end="00:05.000">的小黄花</span><span ttm:role="x-translation" xml:lang="en">The little yellow flower</span><span ttm:role="x-roman" xml:lang="zh-Latn">gushi de xiaohuanghua</span></p>
<p begin="00:05.000" end="00:09.000"><span begin="00:05.000" end="00:07.000">从出生那年</span><span begin="00:07.000" end="00:09.000">就飘着</span><span ttm:role="x-translation" xml:lang="en">has been drifting since the year I was born</span><span ttm:role="x-roman" xml:lang="zh-Latn">cong chusheng nanian</span></p>
<p begin="00:09.000" end="00:13.000"><span begin="00:09.000" end="00:11.000">童年的</span><span begin="00:11.000" end="00:13.000">荡秋千</span><span ttm:role="x-translation" xml:lang="en">The swing of childhood</span></p>
<p begin="00:13.000" end="00:17.000"><span begin="00:13.000" end="00:15.000">随记忆</span><span begin="00:15.000" end="00:17.000">一直晃到现在</span><span ttm:role="x-translation" xml:lang="en">swaying in my memory until now</span></p>
<p begin="00:17.000" end="00:21.000"><span begin="00:17.000" end="00:19.000">吹着前奏</span><span begin="00:19.000" end="00:21.000">望着天空</span><span ttm:role="x-bg" begin="00:19.000" end="00:21.000"><span begin="00:19.000" end="00:21.000">（背景人声）</span></span><span ttm:role="x-translation" xml:lang="en">blowing the prelude, looking at the sky</span></p>
<p begin="00:21.000" end="00:25.000"><span begin="00:21.000" end="00:23.000">我想起花瓣</span><span begin="00:23.000" end="00:25.000">试着掉落</span><span ttm:role="x-translation" xml:lang="en">I think of petals trying to fall</span></p>
</div></body></tt>`

        $('demoBtn').addEventListener('click', () => {
            $('ttmlText').value = DEMO_TTML
            $('pasteWrap').hidden = false
            useTtml(DEMO_TTML, '示例')
        })

        function useTtml(text, label) {
            try {
                currentTtmlId = ''
                const n = render(text)
                if (n) say(label + '：解析出 ' + n + ' 行。', 'ok')
            } catch (e) {
                say('解析失败：' + (e && e.message ? e.message : e), 'err')
            }
        }
        $('usePasted').addEventListener('click', () => {
            const text = $('ttmlText').value
            if (!text.trim()) return say('先把 TTML 粘进文本框。', 'err')
            useTtml(text, '粘贴的内容')
        })
        $('ttmlFile').addEventListener('change', function () {
            const f = this.files && this.files[0]
            if (!f) return
            const reader = new FileReader()
            reader.onload = () => {
                const text = String(reader.result || '')
                $('ttmlText').value = text
                $('pasteWrap').hidden = false
                useTtml(text, f.name)
            }
            reader.onerror = () => say('读文件失败', 'err')
            reader.readAsText(f, 'utf-8')
        })

        window.addEventListener('resize', () => {
            if (player && typeof player.onResize === 'function') player.onResize()
        })

        /* ---------- 按歌名搜歌，一键填 id 并加载 ---------- */
        if (window.SongSearch) {
            SongSearch.mount($('songSearch'), {
                placeholder: '按歌名或歌曲 id 搜索，例如 晴天',
                hint: '搜到后点一下，填进 id 并直接加载歌词',
                // 当前已加载的这首标绿
                getUsedIds: () => [$('songId').value.trim()].filter(Boolean),
                usedLabel: '重新加载',
                onPick: (song) => {
                    $('songId').value = song.id
                    $('loadBtn').click()
                },
            })
        }

        /* ---------- 启动 ---------- */
        ;(async () => {
            say('正在加载 AMLL 播放器…')
            try {
                const core = await importFirst(CORE_CDNS)
                const ttmlMod = await importFirst(TTML_CDNS)
                Player = core.DomLyricPlayer
                parseTTML = ttmlMod.parseTTML
                if (!Player || !parseTTML) throw new Error('AMLL 导出不完整')
                say('AMLL 已就绪。按 id 读取，或粘贴 TTML。')
            } catch (e) {
                say('无法加载 AMLL 播放器（CDN 不可达）：' + (e && e.message ? e.message : e) +
                    '。这个预览页依赖 esm.sh 加载 AMLL。', 'err')
                return
            }
            const id = new URLSearchParams(location.search).get('id')
            if (id && /^\d+$/.test(id)) {
                $('songId').value = id
                $('loadBtn').click()
            }
        })()
    </script>
</body>
</html>
