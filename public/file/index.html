<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" href="/docs/netease.png">
    <title>文件挂载代理 · Sanwith</title>
    <link rel="stylesheet" href="/nav.css">
    <style>
        :root {
            --fg: #ffffff;
            --muted: rgba(255, 255, 255, 0.7);
            --card-bg: rgba(255, 255, 255, 0.09);
            --card-border: rgba(255, 255, 255, 0.15);
            --btn-bg: rgba(255, 255, 255, 0.12);
            --ok: #7ee2a8;
            --err: #ff9c9c;
        }
        * { box-sizing: border-box; }
        html { scrollbar-width: none; -ms-overflow-style: none; }
        html::-webkit-scrollbar { display: none; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--fg);
            background: #0a0a0c;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }
        /* 背景图沿用首页那张，代码里两处保持一致 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image: url('/bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.6);
        }
        .container {
            max-width: 960px;
            margin: 32px auto 60px;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }
        header.site-header { margin-bottom: 22px; user-select: none; }
        header.site-header h1 {
            font-size: 28px;
            font-weight: 600;
            margin: 0;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }
        header.site-header .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

        .block {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 22px 24px;
            margin-bottom: 18px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        .block:hover {
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
        }
        .block h2 {
            margin: 0 0 14px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        input[type="text"], input[type="url"], input[type="password"], input[type="file"] {
            flex: 1 1 260px;
            min-width: 0;
            padding: 10px 12px;
            font-size: 14px;
            color: var(--fg);
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            outline: none;
        }
        input[type="file"] { padding: 8px 10px; }
        input:focus { border-color: rgba(255, 255, 255, 0.45); }
        input::placeholder { color: rgba(255, 255, 255, 0.35); }
        button {
            padding: 10px 18px;
            font-size: 14px;
            color: var(--fg);
            background: var(--btn-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.2); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .hint { margin-top: 10px; font-size: 13px; color: var(--muted); }
        .hint.err { color: var(--err); }
        .hint.ok { color: var(--ok); }

        .notice {
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 18px;
            font-size: 14px;
            background: rgba(255, 156, 156, 0.12);
            border: 1px solid rgba(255, 156, 156, 0.35);
        }
        .notice b { display: block; margin-bottom: 6px; }

        .list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
        .item {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 13px;
        }
        .item .name {
            flex: 1 1 220px;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .item .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
        /* 完整链接单独占一行，方便直接看到/选中/复制 */
        .item .url {
            flex: 1 1 100%;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 12px;
            color: #9fd0ff;
            text-decoration: none;
            user-select: text;
        }
        .item .url:hover { text-decoration: underline; }
        .item .bar {
            flex: 1 1 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            overflow: hidden;
        }
        .item .bar > i {
            display: block;
            height: 100%;
            width: 0;
            background: #fff;
            border-radius: 999px;
            transition: width 0.2s;
        }
        .item a { color: #9fd0ff; text-decoration: none; }
        .item a:hover { text-decoration: underline; }
        .item button { padding: 5px 12px; font-size: 12px; border-radius: 8px; }
        code.selectable { user-select: text; }
        .gate { margin-top: 14px; }
        .gate label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
        /* .gate 不是 flex 容器，flex 属性不起作用，这里直接撑满宽度 */
        .gate input { width: 100%; }
        @media (max-width: 480px) {
            .container { margin: 18px auto 40px; padding: 0 16px; }
            .block { padding: 16px; }
            header.site-header h1 { font-size: 22px; }
        }

        /* 人机验证遮罩。用 fixed 全屏，未通过前挡住整个页面 */
        .verify-gate {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 12, 18, 0.85);
        }
        /* [hidden] 必须压过上面的 display:flex，否则藏不住 */
        .verify-gate[hidden] { display: none; }
        .verify-box {
            width: min(92vw, 400px);
            padding: 24px 22px;
            text-align: center;
            background: rgba(28, 30, 38, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
        }
        .verify-box h2 { margin: 0 0 10px; font-size: 17px; }
        .verify-box .hint { min-height: 18px; }
        .verify-box #turnstileBox { margin-top: 14px; min-height: 65px; }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-list">
            <a href="/">音乐界面</a>
            <a href="/file/" class="active">文件挂载代理</a>
            <a href="/ttml/">TTML 歌词</a>
            <a href="/ttml/admin/">TTML 管理</a>
        </div>
        <span class="nav-brand">
            <a href="https://github.com/neteasecloudmusicapienhanced/api-enhanced" target="_blank" rel="noopener">GitHub</a>
            <span class="footer-sep">|</span>

        </span>

    <main class="container">
        <header class="site-header">
            <h1>文件挂载代理</h1>
            <p class="sub">上传文件 · 永久保存</p>
        </header>

        <div id="notice" class="notice" hidden></div>

        <!-- 人机验证遮罩：只有服务端配了 Turnstile 密钥才会出现 -->
        <div id="verifyGate" class="verify-gate" hidden>
            <div class="verify-box">
                <h2>人机验证</h2>
                <p class="hint" id="verifyHint">正在加载验证组件…</p>
                <div id="turnstileBox"></div>
            </div>
        </div>

        <section class="block">
            <h2>上传文件</h2>
            <div class="row">
                <input type="file" id="fileInput" multiple>
                <button id="uploadBtn">上传</button>
            </div>
            <div class="gate">
                <label for="alwaysKey">永久保存口令，留空则文件 7 天后自动清理</label>
                <input type="password" id="alwaysKey" placeholder="留空 = 7 天有效，填对则永久保存" autocomplete="off">
                <div class="hint" id="quotaInfo">公开口令每月共 5 次，KEY=FileAlways，现已使用?次</div>
            </div>
            <div class="hint" id="uploadHint">文件直接从浏览器传到 Vercel Blob，不经过接口转发，因此不受 4.5MB 限制。</div>
            <div class="list" id="uploadList"></div>
        </section>

        <!-- 只有服务端真的设了 FILE_UPLOAD_KEY（列表返回 403）才显示，
             或者本机之前填过口令时保留，方便修改/清除 -->
        <section class="block" id="gateCard" hidden>
            <h2>访问口令</h2>
            <div class="hint">
                本站已开启访问口令，填对才能上传、查看和删除文件。
            </div>

            <div class="gate">
                <label for="gateKey">访问口令，只保存在本机浏览器</label>
                <input type="password" id="gateKey" placeholder="请输入访问口令" autocomplete="off">
            </div>
        </section>

        <section class="block">
            <h2>已上传文件</h2>
            <div class="row">
                <button id="refreshBtn">刷新列表</button>
            </div>
            <div class="list" id="blobList"></div>
            <div class="hint" id="listInfo"></div>
        </section>
    </main>

    <script>
        (function () {
            'use strict';

            var SDK_VERSION = '2.8.1';
            var CDNS = [
                'https://esm.sh/@vercel/blob@' + SDK_VERSION + '/client',
                'https://cdn.jsdelivr.net/npm/@vercel/blob@' + SDK_VERSION + '/client/+esm',
                'https://esm.sh/@vercel/blob@' + SDK_VERSION,
            ];
            var KEY_STORE = 'bmusic.fileProxy.key';
            var ALWAYS_STORE = 'bmusic.fileProxy.always';
            /* 人机验证通行证：服务端签发的带过期时间的串，存在本机 */
            var PASS_STORE = 'bmusic.fileProxy.pass';

            var $ = function (id) { return document.getElementById(id); };
            var notice = $('notice');
            var uploadList = $('uploadList');
            var blobList = $('blobList');
            var listInfo = $('listInfo');
            var quotaInfo = $('quotaInfo');

            /* ---------- 口令 ---------- */
            function readStore(k) {
                try { return localStorage.getItem(k) || ''; } catch (e) { return ''; }
            }
            function writeStore(k, v) {
                try { localStorage.setItem(k, v); } catch (e) { /* 隐私模式下忽略 */ }
            }
            function getKey() { return readStore(KEY_STORE); }
            function getAlways() { return readStore(ALWAYS_STORE); }
            function getPass() { return readStore(PASS_STORE); }
            function setPass(v) { writeStore(PASS_STORE, v); }
            function clearPass() { try { localStorage.removeItem(PASS_STORE); } catch (e) { /* 忽略 */ } }

            /* ---------- 人机验证（Cloudflare Turnstile） ---------- */
            var TURNSTILE_SRC =
                'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
            var verifyOn = false;
            var siteKey = '';
            var widgetId = null;
            var gateBusy = false;

            /** 管理类请求都带上通行证；没配验证时原样返回 */
            function withPass(url) {
                var p = getPass();
                if (!verifyOn || !p) return url;
                return url + (url.indexOf('?') >= 0 ? '&' : '?') +
                    'pass=' + encodeURIComponent(p);
            }

            function showGate(msg) {
                var g = $('verifyGate');
                if (g) g.hidden = false;
                /* 第一次弹就把组件渲染出来；已经渲染过就只更新文案
                   （通行证过期时会走这条，直接复用原来的组件） */
                if (verifyOn && widgetId === null) renderTurnstile(msg);
                else if (msg) setGateHint(msg);
            }
            function setGateHint(t) {
                var h = $('verifyHint');
                if (h) h.textContent = t;
            }

            /** 按需加载 Turnstile 脚本（只在真的要验证时才拉） */
            function loadTurnstile() {
                if (window.turnstile) return Promise.resolve();
                return new Promise(function (resolve, reject) {
                    var s = document.createElement('script');
                    s.src = TURNSTILE_SRC;
                    s.async = true;
                    s.defer = true;
                    s.onload = function () { resolve(); };
                    s.onerror = function () { reject(new Error('脚本加载失败')); };
                    document.head.appendChild(s);
                });
            }

            /** 用户过了验证：拿令牌换通行证 */
            async function onTurnstileToken(token) {
                if (gateBusy) return;
                gateBusy = true;
                setGateHint('正在校验…');
                try {
                    var r = await api('/file/verify?token=' + encodeURIComponent(token) +
                        '&_=' + Date.now());
                    if (r.ok && r.data && r.data.pass) {
                        setPass(r.data.pass);
                        $('verifyGate').hidden = true;
                        startApp();
                    } else {
                        setGateHint((r.data && r.data.msg) || '验证失败，请重试');
                        if (window.turnstile && widgetId !== null) turnstile.reset(widgetId);
                    }
                } catch (e) {
                    setGateHint('验证请求失败：' + (e.message || e));
                }
                gateBusy = false;
            }

            function renderTurnstile(msg) {
                if (!siteKey) {
                    setGateHint('服务端启用了人机验证，但没有配置 TURNSTILE_SITE_KEY，请联系站长。');
                    return;
                }
                setGateHint(msg || '请完成下面的验证');
                loadTurnstile()
                    .then(function () {
                        widgetId = turnstile.render('#turnstileBox', {
                            sitekey: siteKey,
                            language: 'zh-cn',
                            theme: 'dark',
                            callback: onTurnstileToken,
                            'error-callback': function () {
                                setGateHint('验证组件报错，请刷新页面重试');
                            },
                        });
                    })
                    .catch(function () {
                        setGateHint('无法加载验证组件（challenges.cloudflare.com 不可达），' +
                            '请检查网络或代理后刷新重试');
                    });
            }

            $('gateKey').value = getKey();
            $('alwaysKey').value = getAlways();

            /* 两个口令都即时存到本机。用 change 而不是 input：
               失焦时才保存，免得把输入到一半的半截口令存进去。 */
            $('alwaysKey').addEventListener('change', function () {
                writeStore(ALWAYS_STORE, this.value.trim());
                this.value = getAlways();
                syncAlwaysHint();
                checkAlways();
            });
            $('gateKey').addEventListener('change', function () {
                writeStore(KEY_STORE, this.value.trim());
                this.value = getKey();
                loadBlobs();
            });

            /** 永久保存口令是否已填写（决定显示对应的提示文案） */
            function alwaysHint() {
                return getAlways()
                    ? '文件直接从浏览器传到 Vercel Blob，不受 4.5MB 限制；已填写永久保存口令，上传后不会过期。'
                    : '文件直接从浏览器传到 Vercel Blob，不受 4.5MB 限制。留空时文件 7 天后自动清理。';
            }
            function syncAlwaysHint() {
                $('uploadHint').textContent = alwaysHint();
            }
            syncAlwaysHint();

            /* ---------- 永久保存口令预检（实时显示已用次数） ---------- */
            /* 记住最近一次预检结果，上传前据此拦截，避免撞到 SDK 那句
               没有信息量的英文报错 "Failed to retrieve the client token" */
            var alwaysState = { tier: 'none', limit: 5, used: null, left: null };

            function quotaLine(state) {
                if (state.tier === 'vip') return '私有口令：永久保存，不限次数。';
                if (state.tier === 'invalid') return '永久保存口令不正确，上传会失败；请检查后重填。';
                var limit = state.limit || 5;
                var used = (state.used === null || state.used === undefined) ? '?' : state.used;
                var line = '公开口令每月共 ' + limit + ' 次，KEY=FileAlways，现已使用' + used + '次';
                if (state.used !== null && state.used !== undefined && state.used >= limit) {
                    line += ' —— 本月已用完，下月恢复';
                }
                return line;
            }

            async function checkAlways() {
                var key = getAlways();
                try {
                    var r = await api(withPass('/file/always?_=' + Date.now() +
                        (key ? '&always=' + encodeURIComponent(key) : '')));
                    alwaysState = r.data || alwaysState;
                } catch (e) {
                    alwaysState = { tier: key ? 'unknown' : 'none', limit: 5, used: null, left: null };
                }
                quotaInfo.textContent = quotaLine(alwaysState);
                if (alwaysState.tier === 'invalid') quotaInfo.className = 'hint err';
                else quotaInfo.className = 'hint';
                return alwaysState;
            }

            /* ---------- 通用 ---------- */
            function showNotice(html) {
                notice.innerHTML = html;
                notice.hidden = false;
            }
            function fmtSize(n) {
                if (n === null || n === undefined || isNaN(n)) return '大小未知';
                var u = ['B', 'KB', 'MB', 'GB', 'TB'], i = 0;
                while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
                return (i === 0 ? n : n.toFixed(1)) + ' ' + u[i];
            }
            function fmtTime(t) {
                try { return new Date(t).toLocaleString(); } catch (e) { return ''; }
            }

            /** 链接只用于「显示」时解码一次，中文文件名更好看；
                href 仍然是编码后的形式，保证可用 */
            function prettyUrl(u) {
                try { return decodeURIComponent(u); } catch (e) { return u; }
            }

            function fmtSpeed(bps) {
                if (!isFinite(bps) || bps <= 0) return '';
                return fmtSize(bps) + '/s';
            }

            function fmtEta(sec) {
                if (!isFinite(sec) || sec < 0) return '';
                if (sec < 1) return '不到 1 秒';
                if (sec < 60) return Math.ceil(sec) + ' 秒';
                var m = Math.floor(sec / 60);
                return m + ' 分 ' + Math.round(sec - m * 60) + ' 秒';
            }

            /**
             * 传输进度：把 loaded/total 换算成 百分比 · 速度 · 已传/总量 · 剩余时间。
             * 速度取「距上次采样的增量 / 时间差」再做指数滑动平均，
             * 否则瞬时读数会乱跳。状态挂在元素上，一个元素一份。
             */
            function paintProgress(el, loaded, total) {
                var bar = el.querySelector('.bar');
                if (!bar) {
                    bar = document.createElement('div');
                    bar.className = 'bar';
                    bar.innerHTML = '<i></i>';
                    el.appendChild(bar);
                }
                var st = el._tp || (el._tp = { t: 0, loaded: 0, speed: 0 });
                var now = Date.now();
                if (!st.t) {
                    st.t = now;
                    st.loaded = loaded;
                } else {
                    var dt = (now - st.t) / 1000;
                    if (dt >= 0.3) {
                        var inst = (loaded - st.loaded) / dt;
                        st.speed = st.speed > 0 ? st.speed * 0.65 + inst * 0.35 : inst;
                        st.t = now;
                        st.loaded = loaded;
                    }
                }
                var pct = total ? Math.min(100, (loaded / total) * 100) : 0;
                bar.querySelector('i').style.width = pct.toFixed(1) + '%';

                var parts = [total ? pct.toFixed(0) + '%' : fmtSize(loaded)];
                if (st.speed > 0) parts.push(fmtSpeed(st.speed));
                if (total) parts.push(fmtSize(loaded) + ' / ' + fmtSize(total));
                if (total && st.speed > 0 && loaded < total) {
                    parts.push('剩余 ' + fmtEta((total - loaded) / st.speed));
                }
                var meta = el.querySelector('.meta');
                if (meta) meta.textContent = parts.join(' · ');
            }

            /** 把二进制存成文件；浏览器下载时用这个名字 */
            function saveBlob(blob, name) {
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = name || 'download';
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
            }

            /* 超过这个体积就不整份读进内存，交回浏览器原生下载 */
            var TRACK_MAX = 200 * 1024 * 1024;

            /**
             * 带进度地下载：先 fetch 出字节流（Blob 侧带
             * access-control-allow-origin: *，所以跨域也读得到），
             * 边读边更新进度，读完再用 object URL 存盘。
             * 返回 false 表示这次不接管，调用方应退回普通跳转。
             */
            async function trackedDownload(el, name, size, share) {
                if (size && size > TRACK_MAX) return false;
                var res = await fetch(share);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                if (!res.body || !res.body.getReader) return false;
                /* 响应是 br 压缩过的，content-length 是压缩后的大小，
                   所以总量优先用列表里的真实文件大小 */
                var total = size || Number(res.headers.get('content-length')) || 0;
                var reader = res.body.getReader();
                var chunks = [];
                var loaded = 0;
                for (;;) {
                    var r = await reader.read();
                    if (r.done) break;
                    chunks.push(r.value);
                    loaded += r.value.length;
                    paintProgress(el, loaded, total || loaded);
                }
                paintProgress(el, total || loaded, total || loaded);
                saveBlob(
                    new Blob(chunks, { type: res.headers.get('content-type') || '' }),
                    name
                );
                return true;
            }

            /** 下载入口：能统计进度就统计，不能就退回浏览器原生下载 */
            async function doDownload(el, name, size, share) {
                var meta = el.querySelector('.meta');
                var orig = meta ? meta.textContent : '';
                function say(t) { if (meta) meta.textContent = t; }
                var started = Date.now();
                say('准备下载…');
                try {
                    var ok = await trackedDownload(el, name, size, share);
                    var secs = (Date.now() - started) / 1000;
                    if (!ok) {
                        say('文件较大，交给浏览器下载…');
                        window.location.href = share;
                    } else {
                        say('下载完成 · 用时 ' + fmtEta(secs) +
                            (secs > 0 && size ? ' · 均速 ' + fmtSpeed(size / secs) : ''));
                    }
                } catch (e) {
                    say('下载失败：' + (e && e.message ? e.message : e));
                }
                /* 几秒后恢复原来的「大小 · 时间 · 保存期」信息 */
                setTimeout(function () { if (meta) meta.textContent = orig; }, 5000);
            }

            /** 请求本站 JSON 接口；始终返回 {ok, status, data} */
            function api(path, opts) {
                return fetch(path, opts).then(function (r) {
                    return r.json().catch(function () { return {}; }).then(function (j) {
                        /* 服务端说没通行证 / 通行证过期：清掉本地的并重新弹验证 */
                        if (j && j.needVerify) {
                            clearPass();
                            showGate('需要完成人机验证');
                            if (window.turnstile && widgetId !== null) turnstile.reset(widgetId);
                        }
                        return { ok: r.ok, status: r.status, data: j };
                    });
                });
            }

            /* ---------- 上传组件（按需从 CDN 加载） ---------- */
            var sdkPromise = null;
            function loadSDK() {
                if (sdkPromise) return sdkPromise;
                sdkPromise = (async function () {
                    var lastErr = null;
                    for (var i = 0; i < CDNS.length; i++) {
                        try { return await import(CDNS[i]); } catch (e) { lastErr = e; }
                    }
                    throw new Error('无法加载上传组件：CDN 均不可达' + (lastErr ? '，' + lastErr.message : ''));
                })();
                return sdkPromise;
            }

            /** 在列表里插一行，返回该行元素，供更新进度用 */
            function addRow(container, name) {
                var el = document.createElement('div');
                el.className = 'item';
                el.innerHTML = '<span class="name"></span><span class="meta">等待中</span>' +
                    '<div class="bar"><i></i></div>';
                el.querySelector('.name').textContent = name;
                container.appendChild(el);
                return {
                    el: el,
                    meta: function (t) { el.querySelector('.meta').textContent = t; },
                    progress: function (loaded, total) { paintProgress(el, loaded, total); },
                    done: function (blob, size) {
                        var bar = el.querySelector('.bar');
                        if (bar) bar.remove();
                        var m = el.querySelector('.meta');
                        m.innerHTML = '';

                        var url = blob.url;
                        /* downloadUrl 让浏览器下载而不是内联预览
                           （图片/音频用 url 会被直接打开播放） */
                        var dl = blob.downloadUrl || blob.url;
                        /* 分享用自己域名的短链接，不用 blob.vercel-storage.com 那一长串 */
                        var share = window.location.origin + '/file/get?n=' +
                            encodeURIComponent(String(blob.pathname || '').split('/').pop());

                        function btn(text, handler) {
                            var b = document.createElement('button');
                            b.textContent = text;
                            b.addEventListener('click', handler);
                            return b;
                        }

                        m.appendChild(btn('下载', function () {
                            /* 走自己的短链接：点了照样下载，但链接本身是本站域名 */
                            doDownload(el, String(blob.pathname || '').split('/').pop(),
                                size, '/file/get?n=' +
                                encodeURIComponent(String(blob.pathname || '').split('/').pop()));
                        }));
                        m.appendChild(btn('打开', function () {
                            window.open(url, '_blank', 'noopener');
                        }));
                        m.appendChild(btn('复制链接', function () {
                            navigator.clipboard.writeText(share).then(function () {
                                var t = m.querySelector('button:last-child');
                                t.textContent = '已复制';
                                setTimeout(function () { t.textContent = '复制链接'; }, 1500);
                            });
                        }));

                        var link = document.createElement('a');
                        link.className = 'url';
                        link.href = share;
                        link.rel = 'noopener';
                        link.textContent = prettyUrl(share);
                        link.title = share;
                        el.appendChild(link);
                    },
                    fail: function (msg) {
                        el.querySelector('.bar').remove();
                        var m = el.querySelector('.meta');
                        m.textContent = msg;
                        m.style.color = 'var(--err)';
                    },
                };
            }

            $('uploadBtn').addEventListener('click', async function () {
                var files = $('fileInput').files;
                if (!files || !files.length) {
                    showNotice('<b>还没有选择文件</b>先点“选择文件”，再点“上传”。');
                    return;
                }
                var btn = this;
                btn.disabled = true;
                notice.hidden = true;

                var sdk;
                try {
                    sdk = await loadSDK();
                } catch (e) {
                    btn.disabled = false;
                    showNotice('<b>上传组件加载失败</b>' + e.message);
                    return;
                }

                /* 上传前先确认永久保存口令状态：额度用完 / 口令不对时
                   直接给中文提示，不要等 SDK 抛那句没信息量的英文错误 */
                var st = await checkAlways();
                if (st.tier === 'invalid') {
                    btn.disabled = false;
                    showNotice('<b>永久保存口令不正确</b>请检查「永久保存口令」栏，' +
                        '或清空它按 7 天有效上传。');
                    return;
                }
                if (st.tier === 'pub' && st.used !== null && st.used !== undefined && st.used >= (st.limit || 5)) {
                    btn.disabled = false;
                    showNotice('<b>公开口令本月 ' + (st.limit || 5) + ' 次额度已用完</b>' +
                        '下个月自动恢复。现在可以清空「永久保存口令」栏，' +
                        '按 7 天有效继续上传，不占用额度。');
                    return;
                }

                /* 保存期前缀必须由这里带上：@vercel/blob/client 的 PUT 用的就是
                   传进去的 pathname，服务端只校验不改写，两边必须一致 */
                var folder = st.tier === 'vip' ? 'keep-vip'
                    : st.tier === 'pub' ? 'keep-pub' : 'tmp';

                for (var i = 0; i < files.length; i++) {
                    var file = files[i];
                    var row = addRow(uploadList, file.name);
                    row.meta(fmtSize(file.size) + (folder === 'tmp' ? ' · 7 天有效' : ' · 永久保存'));
                    try {
                        var blob = await sdk.upload(folder + '/' + file.name, file, {
                            access: 'public',
                            handleUploadUrl: withPass('/file/upload'),
                            clientPayload: JSON.stringify({ gate: getKey(), always: getAlways() }),
                            onUploadProgress: function (p) { row.progress(p.loaded, p.total); },
                        });
                        row.done(blob, file.size);
                    } catch (e) {
                        row.fail(e && e.message ? e.message : '上传失败');
                    }
                }
                btn.disabled = false;
                $('fileInput').value = '';
                loadBlobs();
            });

            /* ---------- 已上传文件 ---------- */
            async function loadBlobs() {
                blobList.innerHTML = '';
                listInfo.className = 'hint';
                listInfo.textContent = '加载中…';
                try {
                    var r = await api(withPass('/file/list?_=' + Date.now() +
                        (getKey() ? '&key=' + encodeURIComponent(getKey()) : '')));
                    if (r.status === 501) {
                        blobList.innerHTML = '';
                        listInfo.textContent = '';
                        showNotice('<b>还没配置 Vercel Blob，上传功能暂不可用</b>' +
                            '到 Vercel 项目的 <b>Storage</b> 里创建一个 Blob store，' +
                            '<code class="selectable">BLOB_READ_WRITE_TOKEN</code> 会自动注入到项目，然后重新部署即可。');
                        return;
                    }
                    if (r.status === 403) {
                        /* 服务端设了 FILE_UPLOAD_KEY：这时才需要露出访问口令栏 */
                        $('gateCard').hidden = false;
                        blobList.innerHTML = '';
                        listInfo.textContent = '本站已开启访问口令，请先在上方填写正确的口令';
                        listInfo.className = 'hint err';
                        return;
                    }
                    /* 没开启就藏起来；本机填过口令时保留，方便修改或清除 */
                    $('gateCard').hidden = !getKey();
                    if (!r.ok) throw new Error((r.data && r.data.msg) || ('HTTP ' + r.status));

                    var q = r.data.quota || {};
                    /* 用预检结果统一渲染额度行（已用次数以 keep-pub 下本月文件数为准） */
                    alwaysState = {
                        tier: getAlways() ? alwaysState.tier : 'none',
                        limit: q.limit || alwaysState.limit || 5,
                        used: (q.used === null || q.used === undefined) ? null : q.used,
                        left: (q.left === null || q.left === undefined) ? null : q.left,
                    };
                    if (alwaysState.tier !== 'vip' && alwaysState.tier !== 'invalid') {
                        quotaInfo.textContent = quotaLine(alwaysState);
                    }

                    var blobs = r.data.blobs || [];
                    if (!blobs.length) {
                        listInfo.textContent = '还没有上传过文件';
                        return;
                    }
                    listInfo.textContent = '共 ' + blobs.length + ' 个文件' +
                        (r.data.cleaned ? '，本次清理了 ' + r.data.cleaned + ' 个过期文件' : '');
                    blobs.forEach(function (b) {
                        var el = document.createElement('div');
                        el.className = 'item';
                        var name = document.createElement('span');
                        name.className = 'name';
                        /* 路径前缀 tmp/ keep-pub/ keep-vip/ 只是内部标记，展示时去掉 */
                        name.textContent = String(b.pathname || '').replace(/^(tmp|keep-pub|keep-vip)\//, '');
                        var meta = document.createElement('span');
                        meta.className = 'meta';
                        meta.textContent = fmtSize(b.size) + ' · ' + fmtTime(b.uploadedAt) +
                            (b.retentionLabel ? ' · ' + b.retentionLabel : '');
                        if (b.retention === 'temp') meta.style.color = 'var(--err)';
                        var baseName = String(b.pathname || '').split('/').pop();
                        var dl = document.createElement('a');
                        /* 下载也走本站短链接，链接看起来是自己的域名 */
                        dl.href = window.location.origin + (b.shareUrl ||
                            ('/file/get?n=' + encodeURIComponent(baseName)));
                        dl.textContent = '下载';
                        /* 左键点击时接管，好显示进度/速度；
                           Ctrl/中键等仍然交给浏览器原生处理（另存为/新标签） */
                        dl.addEventListener('click', function (ev) {
                            if (ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.altKey ||
                                ev.button !== 0) return;
                            ev.preventDefault();
                            doDownload(el, baseName, b.size, '/file/get?n=' +
                                encodeURIComponent(baseName));
                        });
                        var copy = document.createElement('button');
                        copy.textContent = '复制链接';
                        copy.addEventListener('click', function () {
                            var share = window.location.origin + (b.shareUrl || ('/file/get?n=' +
                                encodeURIComponent(String(b.pathname || '').split('/').pop())));
                            navigator.clipboard.writeText(share).then(function () {
                                copy.textContent = '已复制';
                                setTimeout(function () { copy.textContent = '复制链接'; }, 1500);
                            });
                        });
                        var rm = document.createElement('button');
                        rm.textContent = '删除';
                        /* 不用 window.confirm：浏览器在多次弹窗后会静默拦截，
                           confirm 直接返回 false，表现就是「点了删除没反应」。
                           改成按钮内两步确认。 */
                        var armed = false;
                        var armTimer = null;
                        rm.addEventListener('click', async function () {
                            if (!armed) {
                                armed = true;
                                rm.textContent = '确认删除？';
                                rm.style.color = 'var(--err)';
                                armTimer = setTimeout(function () {
                                    armed = false;
                                    rm.textContent = '删除';
                                    rm.style.color = '';
                                }, 4000);
                                return;
                            }
                            clearTimeout(armTimer);
                            rm.disabled = true;
                            rm.textContent = '删除中…';
                            /* 带上时间戳绕开服务端 2 分钟的接口缓存，
                               否则删完再拉列表可能拿回删除前的旧数据 */
                            var d = await api(withPass('/file/list?del=' + encodeURIComponent(b.url) +
                                (getKey() ? '&key=' + encodeURIComponent(getKey()) : '') +
                                '&_=' + Date.now()));
                            if (d.ok) {
                                el.remove();
                                listInfo.textContent = '已删除 ' + (b.pathname || '');
                                listInfo.className = 'hint ok';
                                checkAlways();   // 删掉永久文件会把公开额度还回来
                            } else {
                                rm.disabled = false;
                                rm.style.color = '';
                                rm.textContent = '删除失败';
                                listInfo.textContent = (d.data && d.data.msg) ||
                                    ('删除失败 HTTP ' + d.status);
                                listInfo.className = 'hint err';
                            }
                        });
                        el.appendChild(name);
                        el.appendChild(meta);
                        el.appendChild(dl);
                        el.appendChild(copy);
                        el.appendChild(rm);
                        /* 显示的是本站短链接，而不是 blob.vercel-storage.com 那一长串 */
                        var shareUrl = window.location.origin + (b.shareUrl || ('/file/get?n=' +
                            encodeURIComponent(String(b.pathname || '').split('/').pop())));
                        var link = document.createElement('a');
                        link.className = 'url';
                        link.href = shareUrl;
                        link.rel = 'noopener';
                        link.textContent = prettyUrl(shareUrl);
                        link.title = '实际存储地址：' + b.url;
                        el.appendChild(link);
                        blobList.appendChild(el);
                    });
                } catch (e) {
                    listInfo.textContent = e.message || '列表加载失败';
                    listInfo.className = 'hint err';
                }
            }
            $('refreshBtn').addEventListener('click', loadBlobs);

            /** 验证通过（或压根没开验证）后才真正开始拉数据 */
            function startApp() {
                checkAlways();
                loadBlobs();
            }

            /* 启动：先问服务端开没开人机验证。
               没开就直接跑；开了且本机没有通行证，就先弹验证框。
               通行证过期的情况交给 api() —— 它看到 needVerify 会重新弹出。 */
            (async function boot() {
                var cfg = await api('/file/verify?_=' + Date.now());
                verifyOn = !!(cfg.ok && cfg.data && cfg.data.enabled);
                siteKey = (cfg.data && cfg.data.siteKey) || '';
                if (verifyOn && !getPass()) {
                    showGate();
                    return;
                }
                startApp();
            })();
        })();
    </script>
</body>
</html>
