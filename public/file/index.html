<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" href="/docs/netease.png">
    <title>文件挂载代理 · Sanwith</title>
    <link rel="stylesheet" href="/nav.css">
    <style>
        :root {
            --fg: #ffffff;
            --muted: rgba(255, 255, 255, 0.7);
            --card-bg: rgba(255, 255, 255, 0.09);
            --card-border: rgba(255, 255, 255, 0.15);
            --btn-bg: rgba(255, 255, 255, 0.12);
            --ok: #7ee2a8;
            --err: #ff9c9c;
        }
        * { box-sizing: border-box; }
        html { scrollbar-width: none; -ms-overflow-style: none; }
        html::-webkit-scrollbar { display: none; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--fg);
            background: #0a0a0c;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }
        /* 背景图沿用首页那张，代码里两处保持一致 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image: url('/bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.6);
        }
        .container {
            max-width: 960px;
            margin: 32px auto 60px;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }
        header.site-header { margin-bottom: 22px; user-select: none; }
        header.site-header h1 {
            font-size: 28px;
            font-weight: 600;
            margin: 0;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }
        header.site-header .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

        .block {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 22px 24px;
            margin-bottom: 18px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        .block:hover {
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
        }
        .block h2 {
            margin: 0 0 14px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        input[type="text"], input[type="url"], input[type="password"], input[type="file"] {
            flex: 1 1 260px;
            min-width: 0;
            padding: 10px 12px;
            font-size: 14px;
            color: var(--fg);
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            outline: none;
        }
        input[type="file"] { padding: 8px 10px; }
        input:focus { border-color: rgba(255, 255, 255, 0.45); }
        input::placeholder { color: rgba(255, 255, 255, 0.35); }
        button {
            padding: 10px 18px;
            font-size: 14px;
            color: var(--fg);
            background: var(--btn-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.2); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .hint { margin-top: 10px; font-size: 13px; color: var(--muted); }
        .hint.err { color: var(--err); }
        .hint.ok { color: var(--ok); }

        .notice {
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 18px;
            font-size: 14px;
            background: rgba(255, 156, 156, 0.12);
            border: 1px solid rgba(255, 156, 156, 0.35);
        }
        .notice b { display: block; margin-bottom: 6px; }

        .list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
        .item {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 13px;
        }
        .item .name {
            flex: 1 1 220px;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .item .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
        /* 完整链接单独占一行，方便直接看到/选中/复制 */
        .item .url {
            flex: 1 1 100%;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 12px;
            color: #9fd0ff;
            text-decoration: none;
            user-select: text;
        }
        .item .url:hover { text-decoration: underline; }
        .item .bar {
            flex: 1 1 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            overflow: hidden;
        }
        .item .bar > i {
            display: block;
            height: 100%;
            width: 0;
            background: #fff;
            border-radius: 999px;
            transition: width 0.2s;
        }
        .item a { color: #9fd0ff; text-decoration: none; }
        .item a:hover { text-decoration: underline; }
        .item button { padding: 5px 12px; font-size: 12px; border-radius: 8px; }
        code.selectable { user-select: text; }
        .gate { margin-top: 14px; }
        .gate label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
        /* .gate 不是 flex 容器，flex 属性不起作用，这里直接撑满宽度 */
        .gate input { width: 100%; }
        @media (max-width: 480px) {
            .container { margin: 18px auto 40px; padding: 0 16px; }
            .block { padding: 16px; }
            header.site-header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-list">
            <a href="/">音乐界面</a>
            <a href="/file/" class="active">文件挂载代理</a>
        </div>
        <span class="nav-brand">
            <a href="https://github.com/neteasecloudmusicapienhanced/api-enhanced" target="_blank" rel="noopener">GitHub</a>
            <span class="footer-sep">|</span>
            <a href="https://qm.qq.com/q/eetuZkIV20" target="_blank" rel="noopener">添加管理员QQ</a>
        </span>
    </nav>

    <main class="container">
        <header class="site-header">
            <h1>文件挂载代理</h1>
            <p class="sub">上传文件 · 通过 URL 下载</p>
        </header>

        <div id="notice" class="notice" hidden></div>

        <section class="block">
            <h2>上传文件</h2>
            <div class="row">
                <input type="file" id="fileInput" multiple>
                <button id="uploadBtn">上传</button>
            </div>
            <div class="gate">
                <label for="alwaysKey">永久保存口令，留空则文件 7 天后自动清理</label>
                <input type="password" id="alwaysKey" placeholder="留空 = 7 天有效，填对则永久保存" autocomplete="off">
                <div class="hint" id="quotaInfo">公开口令每月共 5 次，KEY=FileAlways，现已使用?次</div>
            </div>
            <div class="hint" id="uploadHint">文件直接从浏览器传到 Vercel Blob，不经过接口转发，因此不受 4.5MB 限制。</div>
            <div class="list" id="uploadList"></div>
        </section>

        <section class="block">
            <h2>通过 URL 下载</h2>
            <div class="row">
                <input type="url" id="dlUrl" placeholder="https://example.com/file.zip">
                <button id="dlBtn">下载</button>
            </div>
            <div class="hint" id="dlInfo">小于 4MB 的文件由本站代理转发，可绕开防盗链；更大的文件会自动改为直连源站下载。</div>
        </section>

        <!-- 只有服务端真的设了 FILE_UPLOAD_KEY（列表返回 403）才显示，
             或者本机之前填过口令时保留，方便修改/清除 -->
        <section class="block" id="gateCard" hidden>
            <h2>访问口令</h2>
            <div class="hint">
                本站已开启访问口令，填对才能上传、查看和删除文件。
            </div>

            <div class="gate">
                <label for="gateKey">访问口令，只保存在本机浏览器</label>
                <input type="password" id="gateKey" placeholder="请输入访问口令" autocomplete="off">
            </div>
        </section>

        <section class="block">
            <h2>已上传文件</h2>
            <div class="row">
                <button id="refreshBtn">刷新列表</button>
            </div>
            <div class="list" id="blobList"></div>
            <div class="hint" id="listInfo"></div>
        </section>
    </main>

    <script>
        (function () {
            'use strict';

            var SDK_VERSION = '2.8.1';
            var CDNS = [
                'https://esm.sh/@vercel/blob@' + SDK_VERSION + '/client',
                'https://cdn.jsdelivr.net/npm/@vercel/blob@' + SDK_VERSION + '/client/+esm',
                'https://esm.sh/@vercel/blob@' + SDK_VERSION,
            ];
            var KEY_STORE = 'bmusic.fileProxy.key';
            var ALWAYS_STORE = 'bmusic.fileProxy.always';

            var $ = function (id) { return document.getElementById(id); };
            var notice = $('notice');
            var uploadList = $('uploadList');
            var blobList = $('blobList');
            var listInfo = $('listInfo');
            var dlInfo = $('dlInfo');
            var quotaInfo = $('quotaInfo');

            /* ---------- 口令 ---------- */
            function readStore(k) {
                try { return localStorage.getItem(k) || ''; } catch (e) { return ''; }
            }
            function writeStore(k, v) {
                try { localStorage.setItem(k, v); } catch (e) { /* 隐私模式下忽略 */ }
            }
            function getKey() { return readStore(KEY_STORE); }
            function getAlways() { return readStore(ALWAYS_STORE); }

            $('gateKey').value = getKey();
            $('alwaysKey').value = getAlways();

            /* 两个口令都即时存到本机。用 change 而不是 input：
               失焦时才保存，免得把输入到一半的半截口令存进去。 */
            $('alwaysKey').addEventListener('change', function () {
                writeStore(ALWAYS_STORE, this.value.trim());
                this.value = getAlways();
                syncAlwaysHint();
                checkAlways();
            });
            $('gateKey').addEventListener('change', function () {
                writeStore(KEY_STORE, this.value.trim());
                this.value = getKey();
                loadBlobs();
            });

            /** 永久保存口令是否已填写（决定显示对应的提示文案） */
            function alwaysHint() {
                return getAlways()
                    ? '文件直接从浏览器传到 Vercel Blob，不受 4.5MB 限制；已填写永久保存口令，上传后不会过期。'
                    : '文件直接从浏览器传到 Vercel Blob，不受 4.5MB 限制。留空时文件 7 天后自动清理。';
            }
            function syncAlwaysHint() {
                $('uploadHint').textContent = alwaysHint();
            }
            syncAlwaysHint();

            /* ---------- 永久保存口令预检（实时显示已用次数） ---------- */
            /* 记住最近一次预检结果，上传前据此拦截，避免撞到 SDK 那句
               没有信息量的英文报错 "Failed to retrieve the client token" */
            var alwaysState = { tier: 'none', limit: 5, used: null, left: null };

            function quotaLine(state) {
                if (state.tier === 'vip') return '私有口令：永久保存，不限次数。';
                if (state.tier === 'invalid') return '永久保存口令不正确，上传会失败；请检查后重填。';
                var limit = state.limit || 5;
                var used = (state.used === null || state.used === undefined) ? '?' : state.used;
                var line = '公开口令每月共 ' + limit + ' 次，KEY=FileAlways，现已使用' + used + '次';
                if (state.used !== null && state.used !== undefined && state.used >= limit) {
                    line += ' —— 本月已用完，下月恢复';
                }
                return line;
            }

            async function checkAlways() {
                var key = getAlways();
                try {
                    var r = await api('/file/always?_=' + Date.now() +
                        (key ? '&always=' + encodeURIComponent(key) : ''));
                    alwaysState = r.data || alwaysState;
                } catch (e) {
                    alwaysState = { tier: key ? 'unknown' : 'none', limit: 5, used: null, left: null };
                }
                quotaInfo.textContent = quotaLine(alwaysState);
                if (alwaysState.tier === 'invalid') quotaInfo.className = 'hint err';
                else quotaInfo.className = 'hint';
                return alwaysState;
            }
            checkAlways();

            /* ---------- 通用 ---------- */
            function showNotice(html) {
                notice.innerHTML = html;
                notice.hidden = false;
            }
            function fmtSize(n) {
                if (n === null || n === undefined || isNaN(n)) return '大小未知';
                var u = ['B', 'KB', 'MB', 'GB', 'TB'], i = 0;
                while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
                return (i === 0 ? n : n.toFixed(1)) + ' ' + u[i];
            }
            function fmtTime(t) {
                try { return new Date(t).toLocaleString(); } catch (e) { return ''; }
            }

            /** 请求本站 JSON 接口；始终返回 {ok, status, data} */
            function api(path, opts) {
                return fetch(path, opts).then(function (r) {
                    return r.json().catch(function () { return {}; }).then(function (j) {
                        return { ok: r.ok, status: r.status, data: j };
                    });
                });
            }

            /** 把二进制存成文件；浏览器下载时用这个名字 */
            function saveBlob(blob, name) {
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = name || 'download';
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
            }

            /* ---------- 上传组件（按需从 CDN 加载） ---------- */
            var sdkPromise = null;
            function loadSDK() {
                if (sdkPromise) return sdkPromise;
                sdkPromise = (async function () {
                    var lastErr = null;
                    for (var i = 0; i < CDNS.length; i++) {
                        try { return await import(CDNS[i]); } catch (e) { lastErr = e; }
                    }
                    throw new Error('无法加载上传组件：CDN 均不可达' + (lastErr ? '，' + lastErr.message : ''));
                })();
                return sdkPromise;
            }

            /** 在列表里插一行，返回该行元素，供更新进度用 */
            function addRow(container, name) {
                var el = document.createElement('div');
                el.className = 'item';
                el.innerHTML = '<span class="name"></span><span class="meta">等待中</span>' +
                    '<div class="bar"><i></i></div>';
                el.querySelector('.name').textContent = name;
                container.appendChild(el);
                return {
                    el: el,
                    meta: function (t) { el.querySelector('.meta').textContent = t; },
                    progress: function (p) { el.querySelector('.bar > i').style.width = p + '%'; },
                    done: function (blob) {
                        var bar = el.querySelector('.bar');
                        if (bar) bar.remove();
                        var m = el.querySelector('.meta');
                        m.innerHTML = '';

                        var url = blob.url;
                        /* downloadUrl 让浏览器下载而不是内联预览
                           （图片/音频用 url 会被直接打开播放） */
                        var dl = blob.downloadUrl || blob.url;
                        /* 分享用自己域名的短链接，不用 blob.vercel-storage.com 那一长串 */
                        var share = window.location.origin + '/file/get?n=' +
                            encodeURIComponent(String(blob.pathname || '').split('/').pop());

                        function btn(text, handler) {
                            var b = document.createElement('button');
                            b.textContent = text;
                            b.addEventListener('click', handler);
                            return b;
                        }

                        m.appendChild(btn('下载', function () {
                            /* 走自己的短链接：点了照样下载，但链接本身是本站域名 */
                            window.location.href = share;
                        }));
                        m.appendChild(btn('打开', function () {
                            window.open(url, '_blank', 'noopener');
                        }));
                        m.appendChild(btn('复制链接', function () {
                            navigator.clipboard.writeText(share).then(function () {
                                var t = m.querySelector('button:last-child');
                                t.textContent = '已复制';
                                setTimeout(function () { t.textContent = '复制链接'; }, 1500);
                            });
                        }));

                        var link = document.createElement('a');
                        link.className = 'url';
                        link.href = share;
                        link.rel = 'noopener';
                        link.textContent = share;
                        link.title = share;
                        el.appendChild(link);
                    },
                    fail: function (msg) {
                        el.querySelector('.bar').remove();
                        var m = el.querySelector('.meta');
                        m.textContent = msg;
                        m.style.color = 'var(--err)';
                    },
                };
            }

            $('uploadBtn').addEventListener('click', async function () {
                var files = $('fileInput').files;
                if (!files || !files.length) {
                    showNotice('<b>还没有选择文件</b>先点“选择文件”，再点“上传”。');
                    return;
                }
                var btn = this;
                btn.disabled = true;
                notice.hidden = true;

                var sdk;
                try {
                    sdk = await loadSDK();
                } catch (e) {
                    btn.disabled = false;
                    showNotice('<b>上传组件加载失败</b>' + e.message);
                    return;
                }

                /* 上传前先确认永久保存口令状态：额度用完 / 口令不对时
                   直接给中文提示，不要等 SDK 抛那句没信息量的英文错误 */
                var st = await checkAlways();
                if (st.tier === 'invalid') {
                    btn.disabled = false;
                    showNotice('<b>永久保存口令不正确</b>请检查「永久保存口令」栏，' +
                        '或清空它按 7 天有效上传。');
                    return;
                }
                if (st.tier === 'pub' && st.used !== null && st.used !== undefined && st.used >= (st.limit || 5)) {
                    btn.disabled = false;
                    showNotice('<b>公开口令本月 ' + (st.limit || 5) + ' 次额度已用完</b>' +
                        '下个月自动恢复。现在可以清空「永久保存口令」栏，' +
                        '按 7 天有效继续上传，不占用额度。');
                    return;
                }

                /* 保存期前缀必须由这里带上：@vercel/blob/client 的 PUT 用的就是
                   传进去的 pathname，服务端只校验不改写，两边必须一致 */
                var folder = st.tier === 'vip' ? 'keep-vip'
                    : st.tier === 'pub' ? 'keep-pub' : 'tmp';

                for (var i = 0; i < files.length; i++) {
                    var file = files[i];
                    var row = addRow(uploadList, file.name);
                    row.meta(fmtSize(file.size) + (folder === 'tmp' ? ' · 7 天有效' : ' · 永久保存'));
                    try {
                        var blob = await sdk.upload(folder + '/' + file.name, file, {
                            access: 'public',
                            handleUploadUrl: '/file/upload',
                            clientPayload: JSON.stringify({ gate: getKey(), always: getAlways() }),
                            onUploadProgress: function (p) { row.progress(p.percentage); },
                        });
                        row.done(blob);
                    } catch (e) {
                        row.fail(e && e.message ? e.message : '上传失败');
                    }
                }
                btn.disabled = false;
                $('fileInput').value = '';
                loadBlobs();
            });

            /* ---------- 通过 URL 下载 ---------- */
            $('dlBtn').addEventListener('click', async function () {
                var raw = $('dlUrl').value.trim();
                if (!raw) { dlInfo.textContent = '请先填写文件地址'; dlInfo.className = 'hint err'; return; }
                var btn = this;
                btn.disabled = true;
                dlInfo.className = 'hint';
                dlInfo.textContent = '正在探测文件…';
                try {
                    var probe = await api('/file/dl?probe=1&url=' + encodeURIComponent(raw));
                    if (!probe.ok) throw new Error((probe.data && probe.data.msg) || ('探测失败 HTTP ' + probe.status));
                    var meta = probe.data;

                    if (meta.proxy) {
                        dlInfo.textContent = '正在经由本站转发… ' + fmtSize(meta.size);
                        var r = await fetch('/file/dl?url=' + encodeURIComponent(raw));
                        if (!r.ok) throw new Error('转发失败 HTTP ' + r.status);
                        saveBlob(await r.blob(), meta.name);
                        dlInfo.textContent = '已开始下载：' + meta.name + ' · ' + fmtSize(meta.size);
                        dlInfo.className = 'hint ok';
                    } else {
                        dlInfo.textContent = '文件 ' + fmtSize(meta.size) + ' 超过 4MB，改为直连源站下载…';
                        window.location.href = '/file/dl?url=' + encodeURIComponent(raw);
                    }
                } catch (e) {
                    dlInfo.textContent = e.message || '下载失败';
                    dlInfo.className = 'hint err';
                }
                btn.disabled = false;
            });

            /* ---------- 已上传文件 ---------- */
            async function loadBlobs() {
                blobList.innerHTML = '';
                listInfo.className = 'hint';
                listInfo.textContent = '加载中…';
                try {
                    var r = await api('/file/list?_=' + Date.now() +
                        (getKey() ? '&key=' + encodeURIComponent(getKey()) : ''));
                    if (r.status === 501) {
                        blobList.innerHTML = '';
                        listInfo.textContent = '';
                        showNotice('<b>还没配置 Vercel Blob，上传功能暂不可用</b>' +
                            '到 Vercel 项目的 <b>Storage</b> 里创建一个 Blob store，' +
                            '<code class="selectable">BLOB_READ_WRITE_TOKEN</code> 会自动注入到项目，然后重新部署即可。');
                        return;
                    }
                    if (r.status === 403) {
                        /* 服务端设了 FILE_UPLOAD_KEY：这时才需要露出访问口令栏 */
                        $('gateCard').hidden = false;
                        blobList.innerHTML = '';
                        listInfo.textContent = '本站已开启访问口令，请先在上方填写正确的口令';
                        listInfo.className = 'hint err';
                        return;
                    }
                    /* 没开启就藏起来；本机填过口令时保留，方便修改或清除 */
                    $('gateCard').hidden = !getKey();
                    if (!r.ok) throw new Error((r.data && r.data.msg) || ('HTTP ' + r.status));

                    var q = r.data.quota || {};
                    /* 用预检结果统一渲染额度行（已用次数以 keep-pub 下本月文件数为准） */
                    alwaysState = {
                        tier: getAlways() ? alwaysState.tier : 'none',
                        limit: q.limit || alwaysState.limit || 5,
                        used: (q.used === null || q.used === undefined) ? null : q.used,
                        left: (q.left === null || q.left === undefined) ? null : q.left,
                    };
                    if (alwaysState.tier !== 'vip' && alwaysState.tier !== 'invalid') {
                        quotaInfo.textContent = quotaLine(alwaysState);
                    }

                    var blobs = r.data.blobs || [];
                    if (!blobs.length) {
                        listInfo.textContent = '还没有上传过文件';
                        return;
                    }
                    listInfo.textContent = '共 ' + blobs.length + ' 个文件' +
                        (r.data.cleaned ? '，本次清理了 ' + r.data.cleaned + ' 个过期文件' : '');
                    blobs.forEach(function (b) {
                        var el = document.createElement('div');
                        el.className = 'item';
                        var name = document.createElement('span');
                        name.className = 'name';
                        /* 路径前缀 tmp/ keep-pub/ keep-vip/ 只是内部标记，展示时去掉 */
                        name.textContent = String(b.pathname || '').replace(/^(tmp|keep-pub|keep-vip)\//, '');
                        var meta = document.createElement('span');
                        meta.className = 'meta';
                        meta.textContent = fmtSize(b.size) + ' · ' + fmtTime(b.uploadedAt) +
                            (b.retentionLabel ? ' · ' + b.retentionLabel : '');
                        if (b.retention === 'temp') meta.style.color = 'var(--err)';
                        var dl = document.createElement('a');
                        /* 下载也走本站短链接，链接看起来是自己的域名 */
                        dl.href = window.location.origin + (b.shareUrl || ('/file/get?n=' +
                            encodeURIComponent(String(b.pathname || '').split('/').pop())));
                        dl.textContent = '下载';
                        var copy = document.createElement('button');
                        copy.textContent = '复制链接';
                        copy.addEventListener('click', function () {
                            var share = window.location.origin + (b.shareUrl || ('/file/get?n=' +
                                encodeURIComponent(String(b.pathname || '').split('/').pop())));
                            navigator.clipboard.writeText(share).then(function () {
                                copy.textContent = '已复制';
                                setTimeout(function () { copy.textContent = '复制链接'; }, 1500);
                            });
                        });
                        var rm = document.createElement('button');
                        rm.textContent = '删除';
                        /* 不用 window.confirm：浏览器在多次弹窗后会静默拦截，
                           confirm 直接返回 false，表现就是「点了删除没反应」。
                           改成按钮内两步确认。 */
                        var armed = false;
                        var armTimer = null;
                        rm.addEventListener('click', async function () {
                            if (!armed) {
                                armed = true;
                                rm.textContent = '确认删除？';
                                rm.style.color = 'var(--err)';
                                armTimer = setTimeout(function () {
                                    armed = false;
                                    rm.textContent = '删除';
                                    rm.style.color = '';
                                }, 4000);
                                return;
                            }
                            clearTimeout(armTimer);
                            rm.disabled = true;
                            rm.textContent = '删除中…';
                            /* 带上时间戳绕开服务端 2 分钟的接口缓存，
                               否则删完再拉列表可能拿回删除前的旧数据 */
                            var d = await api('/file/list?del=' + encodeURIComponent(b.url) +
                                (getKey() ? '&key=' + encodeURIComponent(getKey()) : '') +
                                '&_=' + Date.now());
                            if (d.ok) {
                                el.remove();
                                listInfo.textContent = '已删除 ' + (b.pathname || '');
                                listInfo.className = 'hint ok';
                                checkAlways();   // 删掉永久文件会把公开额度还回来
                            } else {
                                rm.disabled = false;
                                rm.style.color = '';
                                rm.textContent = '删除失败';
                                listInfo.textContent = (d.data && d.data.msg) ||
                                    ('删除失败 HTTP ' + d.status);
                                listInfo.className = 'hint err';
                            }
                        });
                        el.appendChild(name);
                        el.appendChild(meta);
                        el.appendChild(dl);
                        el.appendChild(copy);
                        el.appendChild(rm);
                        /* 显示的是本站短链接，而不是 blob.vercel-storage.com 那一长串 */
                        var shareUrl = window.location.origin + (b.shareUrl || ('/file/get?n=' +
                            encodeURIComponent(String(b.pathname || '').split('/').pop())));
                        var link = document.createElement('a');
                        link.className = 'url';
                        link.href = shareUrl;
                        link.rel = 'noopener';
                        link.textContent = shareUrl;
                        link.title = '实际存储地址：' + b.url;
                        el.appendChild(link);
                        blobList.appendChild(el);
                    });
                } catch (e) {
                    listInfo.textContent = e.message || '列表加载失败';
                    listInfo.className = 'hint err';
                }
            }
            $('refreshBtn').addEventListener('click', loadBlobs);
            loadBlobs();
        })();
    </script>
</body>
</html>
